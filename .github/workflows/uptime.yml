name: Uptime monitor

on:
  schedule:
    # Asks for every 10 minutes, but GitHub throttles scheduled runs on this
    # repo to roughly every 3-5 hours in practice. Treat it as a few checks a
    # day; use an external uptime service if minute-level alerts are needed.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      force_heartbeat:
        description: "Send a test email even if healthy"
        type: boolean
        default: false

# Only one monitor run at a time; a slow run won't pile up on the next tick.
concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Restore the previous run's state (last.json) so we can alert only on
      # CHANGES. Exact key never hits (unique per run); restore-keys prefix
      # match pulls the most recent prior state.
      - name: Restore monitor state
        uses: actions/cache/restore@v4
        with:
          path: monitoring/state
          key: uptime-state-${{ github.run_id }}
          restore-keys: |
            uptime-state-

      - name: Run health check
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          STATE_FILE: monitoring/state/last.json
          FORCE_HEARTBEAT: ${{ (github.event_name == 'workflow_dispatch' && inputs.force_heartbeat) && '1' || '0' }}
        run: node monitoring/health-check.mjs

      # Persist updated state for the next run.
      - name: Save monitor state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: monitoring/state
          key: uptime-state-${{ github.run_id }}
